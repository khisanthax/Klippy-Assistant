[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "klippy-assistant"
version = "0.8.0.dev3"
description = "Local Windows companion for approved Klipper printers"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8,<7", "httpx>=0.28,<1", "websockets>=15,<18", "pydantic>=2.10,<3", "keyring>=25,<26", "zeroconf>=0.145,<1", "numpy>=2,<3", "sounddevice>=0.5,<1", "sherpa-onnx>=2.0,<3", "pywebrtc-audio==0.2.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1", "pyinstaller>=6,<7", "sentencepiece>=0.2,<1", "cmudict==1.1.3"]

[project.scripts]
klippy = "klippy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

