name: Windows validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -e . --no-deps
      - run: python -m ruff check src tests scripts
      - run: python -m pytest -q --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
  preview-build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -e . --no-deps
      - uses: actions/cache@v4
        with:
          path: local/model-cache
          key: klippy-model-inputs-${{ hashFiles('scripts/model_sources.json') }}
      - run: python scripts/prepare_models.py
      - run: choco install innosetup --no-progress -y
      - shell: pwsh
        run: ./scripts/build.ps1 -Python python -Iscc 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
      - uses: actions/upload-artifact@v4
        with:
          name: klippy-engineering-preview
          path: |
            dist/Klippy-Setup-*.exe
            dist/Klippy-Setup-*.sha256
          retention-days: 14
